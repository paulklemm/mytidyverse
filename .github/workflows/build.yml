name: build

# Builds paulklemm/mytidyverse on a native amd64 runner and pushes it to
# Docker Hub. Triggered by pushing a version tag (e.g. 4.6.1-2, see
# `make ci-build`) or manually via "Run workflow" for rebuilding a version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to build and push (e.g. 4.6.1-2)"
        required: true
        type: string

env:
  IMAGE: paulklemm/mytidyverse

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # The runner has ~14 GB free by default; the image needs ~25 GB of
      # working room. Dropping the preinstalled Android/.NET/Haskell
      # toolchains reclaims ~30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build --pull --platform linux/amd64 -t mytidyverse .

      - name: Smoke-test image
        run: |
          docker run --rm mytidyverse Rscript -e 'library(tidyverse); library(rJava)'
          docker run --rm mytidyverse python3 -c 'import pandas, scanpy, scvi'
          docker run --rm mytidyverse quarto --version
          docker run --rm mytidyverse node --version
          docker run --rm mytidyverse npm --version
          docker run --rm mytidyverse singularity --version
          docker run -d --name smoke -p 3838:3838 mytidyverse
          ok=""
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3838; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "shiny-server did not respond on :3838"
            docker logs smoke
            exit 1
          fi
          docker stop smoke

      - name: Push image
        run: |
          docker tag mytidyverse "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
